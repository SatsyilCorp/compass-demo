title = "Compass secret scanning policy"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Public RFC 6238 SHA1 TOTP test vector"
  condition = "AND"
  regexTarget = "secret"
  regexes = [
    '''^GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ$''',
  ]
  paths = [
    '''scripts/tests/test_provision_demo_identities\.py''',
  ]
