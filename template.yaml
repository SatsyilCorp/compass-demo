          storage.location.template: !Sub "s3://${ScaleDataLakeBucket}/curated/stream_events/run_id=${!run_id}/"
        PartitionKeys:
          - { Name: run_id, Type: string }
        StorageDescriptor:
          Location: !Sub "s3://${ScaleDataLakeBucket}/curated/stream_events/"
          Compressed: true
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
          Columns:
            - { Name: schema_version, Type: string }
            - { Name: synthetic, Type: boolean }
            - { Name: synthetic_seed, Type: bigint }
            - { Name: source_system, Type: string }
            - { Name: event_id, Type: string }
            - { Name: grant_id, Type: string }
            - { Name: grant_no, Type: string }
            - { Name: event_type, Type: string }
            - { Name: event_time, Type: string }
            - { Name: sequence, Type: bigint }
            - { Name: partition_key, Type: string }
            - { Name: payload, Type: "struct<metric:string,value:bigint,correlation_id:string>" }
            - { Name: scale_run_id, Type: string }
            - { Name: scale_dataset, Type: string }
            - { Name: scale_partition_id, Type: string }
            - { Name: scale_record_index, Type: bigint }

  ScaleAthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Condition: EnableScaleFeature
    Properties:
      Name: !Sub "${AWS::StackName}-scale"
      Description: Cost-bounded Scale Run conversion and evidence queries.
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        BytesScannedCutoffPerQuery: !Ref ScaleAthenaBytesScannedCutoff
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        RequesterPaysEnabled: false
        EngineVersion:
          SelectedEngineVersion: Athena engine version 3
        ResultConfiguration:
          OutputLocation: !Sub "s3://${ScaleDataLakeBucket}/athena-results/"
          EncryptionConfiguration:
            EncryptionOption: SSE_KMS
            KmsKey: !GetAtt AppKey.Arn

  # ===========================================================================
  # (8) Lambda functions - one per src/functions dir, all on CommonLayer.
  #     DB-touching functions run in the private subnets. Route map follows
  #     docs/CONTRACTS.md exactly (see each function's Events).
  # ===========================================================================

  # All functions use one stack-owned group. Lambda keeps function and version
  # identity in each custom-group stream, while retention remains centralized.
  ApplicationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/compass/${AWS::StackName}/lambda"
      RetentionInDays: 14

  # --- authorizer: GET /me + the named Lambda REQUEST authorizer. No VPC/DB:
  #     identity, role and org_unit derive entirely from the Cognito JWT.
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-authorizer"
      CodeUri: src/functions/authorizer/
      Handler: app.handler
      MemorySize: 256
      Timeout: 10
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          WEB_CLIENT_ID: !Ref WebClient
      Events:
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /me

  # --- intake: ingest simulation + status + stream ticker; also the first
  #     worker of the intake state machine and the scheduled Kinesis producer.
  IntakeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-intake"
      CodeUri: src/functions/intake/
      Handler: app.handler
      MemorySize: 512
      Timeout: 60
      Layers: [!Ref CommonLayer]
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Environment:
        Variables:
          RAW_BUCKET: !Ref RawBucket
          STREAM_NAME: !Ref TickerStream
          OPERATIONS_TABLE: !Ref OperationsTable
          OPERATIONS_TOPIC_ARN: !Ref OperationsTopic
          # Name-derived ARN (not !Ref) to avoid a circular dependency with
          # the state machine, whose definition references this function.
          INTAKE_STATE_MACHINE_ARN: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-intake"
      Policies:
        - Statement:
            - Sid: DbSecretRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn
            - Sid: KmsForDataPlane
              Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey]
              Resource: !GetAtt AppKey.Arn
            - Sid: RawBucketRW
              Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
              Resource:
                - !GetAtt RawBucket.Arn
                - !Sub "${RawBucket.Arn}/*"
            - Sid: TickerStreamRW
              Effect: Allow
              Action:
                - kinesis:PutRecord
                - kinesis:PutRecords
                - kinesis:GetRecords
                - kinesis:GetShardIterator
                - kinesis:DescribeStream
                - kinesis:DescribeStreamSummary
                - kinesis:ListShards
              Resource: !GetAtt TickerStream.Arn
            - Sid: WriteOperationalEvidence
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt OperationsTable.Arn
            - Sid: PublishOperationalSignals
              Effect: Allow
              Action: sns:Publish
              Resource: !Ref OperationsTopic
            - Sid: StartIntakeStateMachine
              Effect: Allow
              Action: states:StartExecution
              Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-intake"
            - Sid: BedrockEmbed
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
      Events:
        SimulateIngest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /ingest/simulate
        IngestStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /ingest/status
        StreamRecent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /stream/recent
        StreamTick:
          Type: Schedule
          Properties:
            Name: !Sub "${AWS::StackName}-stream-tick"
            Description: Once-a-minute synthetic ticker producer onto Kinesis.
            Schedule: rate(1 minute)
            State: !Ref StreamTickerState
            Input: '{"action": "stream_tick"}'

  # --- document_ml: browser upload, document lake stages, classical model
  #     training/evaluation, registry promotion, and drift evidence.
  DocumentMlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-document-ml"
      CodeUri: src/functions/document_ml/
      Handler: app.handler
      MemorySize: 1024
      Timeout: 120
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          DOCUMENT_LAKE_BUCKET: !Ref RawBucket
          DOCUMENT_ML_TABLE: !Ref DocumentMlTable
          OPERATIONS_TABLE: !Ref OperationsTable
          OPERATIONS_TOPIC_ARN: !Ref OperationsTopic
          MLOPS_MODE: !Ref MlOpsMode
          SAGEMAKER_EXECUTION_ROLE_ARN: !GetAtt DocumentSageMakerExecutionRole.Arn
          SAGEMAKER_TRAINING_IMAGE: !Ref SageMakerTrainingImage
          SAGEMAKER_MODEL_PACKAGE_GROUP: !Ref DocumentModelPackageGroup
      Policies:
        - Statement:
            - Sid: DocumentLakeList
              Effect: Allow
              Action: [s3:ListBucket, s3:GetBucketLocation]
              Resource: !GetAtt RawBucket.Arn
              Condition:
                StringLike:
                  s3:prefix:
                    - documents/*
                    - mlops/*
            - Sid: DocumentLakeObjects
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:AbortMultipartUpload
              Resource:
                - !Sub "${RawBucket.Arn}/documents/*"
                - !Sub "${RawBucket.Arn}/mlops/*"
            - Sid: DocumentLakeKms
              Effect: Allow
              Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey]
              Resource: !GetAtt AppKey.Arn
            - Sid: DocumentMlLedger
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - !GetAtt DocumentMlTable.Arn
                - !Sub "${DocumentMlTable.Arn}/index/by-type"
            - Sid: WriteOperationalEvidence
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt OperationsTable.Arn
            - Sid: PublishOperationalSignals
              Effect: Allow
              Action: sns:Publish
              Resource: !Ref OperationsTopic
            - Sid: SubmitBoundedDocumentTraining
              Effect: Allow
              Action:
                - sagemaker:CreateTrainingJob
                - sagemaker:DescribeTrainingJob
                - sagemaker:StopTrainingJob
              Resource: !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:training-job/compass-doc-*"
            - Sid: ReadDocumentModelPackageGroup
              Effect: Allow
              Action:
                - sagemaker:DescribeModelPackageGroup
                - sagemaker:ListModelPackages
              Resource: !GetAtt DocumentModelPackageGroup.ModelPackageGroupArn
            - Sid: PassDocumentTrainingRole
              Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt DocumentSageMakerExecutionRole.Arn
              Condition:
                StringEquals:
                  iam:PassedToService: sagemaker.amazonaws.com
      Events:
        RequestDocumentUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /documents/uploads
        ListDocumentRuns:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /documents/runs
        GetDocumentRun:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /documents/runs/{run_id}
        TrainDocumentModel:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /ml/train
        ListDocumentModels:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /ml/models
        DeployDocumentModel:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /ml/models/{version}/deploy
        EvaluateDocumentDrift:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /ml/drift/evaluate
        GetDocumentMlOpsEvidence:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /ml/ops/evidence

  # --- public_acquisition: bounded USAspending scheduled micro-batch. The
  #     accepted snapshot is public-only, digest-bound, versioned, and projected
  #     into the operational lineage ledger before a small Kinesis delta event.
  PublicAcquisitionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-public-acquisition"
      CodeUri: src/functions/public_acquisition/
      Handler: app.handler
      MemorySize: 512
      Timeout: 60
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          OPERATIONS_TABLE: !Ref OperationsTable
          OPERATIONS_TOPIC_ARN: !Ref OperationsTopic
          PUBLIC_ACQUISITION_BUCKET: !Ref RawBucket
          PUBLIC_ACQUISITION_CHANGE_ALERT_THRESHOLD: !Ref PublicAcquisitionChangeAlertThreshold
          STREAM_NAME: !Ref TickerStream
      Policies:
        - Statement:
            - Sid: RetainPublicAcquisition
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${RawBucket.Arn}/public-intelligence/acquisitions/*"
            - Sid: EncryptPublicAcquisition
              Effect: Allow
              Action: [kms:Encrypt, kms:GenerateDataKey]
              Resource: !GetAtt AppKey.Arn
            - Sid: PublicAcquisitionLedger
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query]
              Resource:
                - !GetAtt OperationsTable.Arn
                - !Sub "${OperationsTable.Arn}/index/by-type"
            - Sid: PublishOperationalSignals
              Effect: Allow
              Action: sns:Publish
              Resource: !Ref OperationsTopic
            - Sid: PublishPublicChangeEvent
              Effect: Allow
              Action: [kinesis:PutRecord, kinesis:PutRecords]
              Resource: !GetAtt TickerStream.Arn
      Events:
        ListPublicAcquisitions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /public-intelligence/acquisitions
        RunPublicAcquisition:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /public-intelligence/acquisitions/run
        ScheduledPublicAcquisition:
          Type: Schedule
          Properties:
            Name: !Sub "${AWS::StackName}-public-acquisition"
            Description: Five-minute bounded USAspending public evidence poll.
            Schedule: rate(5 minutes)
            State: !Ref PublicAcquisitionState
            Input: '{"action":"poll"}'
            RetryPolicy:
              MaximumEventAgeInSeconds: 3600
              MaximumRetryAttempts: 2
            DeadLetterConfig:
              Type: SQS
              QueueLogicalId: PublicAcquisitionScheduleDeadLetterQueue

  PublicAcquisitionScheduleDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-public-acquisition-schedule-dlq"
      AlarmDescription: Scheduled public-source deliveries exhausted their bounded retry policy.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PublicAcquisitionScheduleDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]
      OKActions: [!Ref OperationsTopic]

  # --- operations: protected read and acknowledgement surface for the compact
  #     lineage and notification projection. It never reads raw source records.
  OperationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-operations"
      CodeUri: src/functions/operations/
      Handler: app.handler
      MemorySize: 512
      Timeout: 30
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          OPERATIONS_TABLE: !Ref OperationsTable
      Policies:
        - Statement:
            - Sid: ReadAndAcknowledgeOperationalEvidence
              Effect: Allow
              Action: [dynamodb:Query, dynamodb:UpdateItem]
              Resource:
                - !GetAtt OperationsTable.Arn
                - !Sub "${OperationsTable.Arn}/index/by-type"
      Events:
        ListOperationalSignals:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /operations/signals
        AcknowledgeOperationalSignal:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /operations/signals/{eventId}/acknowledge
        ListOperationalLineage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /operations/lineage
        GetOperationalLineage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /operations/lineage/{runId}
        GetOperationalSummary:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /operations/summary

  # --- quality_gate: rule engine invoked by the intake state machine; writes
  #     grant_quality + lineage. Not routed on the API.
  QualityGateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-quality-gate"
      CodeUri: src/functions/quality_gate/
      Handler: app.handler
      MemorySize: 512
      Timeout: 60
      Layers: [!Ref CommonLayer]
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Environment:
        Variables:
          RAW_BUCKET: !Ref RawBucket
          OPERATIONS_TABLE: !Ref OperationsTable
          OPERATIONS_TOPIC_ARN: !Ref OperationsTopic
      Policies:
        - Statement:
            - Sid: DbSecretRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn
            - Sid: KmsForDataPlane
              Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey]
              Resource: !GetAtt AppKey.Arn
            - Sid: RawBucketRead
              Effect: Allow
              Action: [s3:GetObject, s3:ListBucket]
              Resource:
                - !GetAtt RawBucket.Arn
                - !Sub "${RawBucket.Arn}/*"
            - Sid: WriteOperationalEvidence
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt OperationsTable.Arn
            - Sid: PublishOperationalSignals
              Effect: Allow
              Action: sns:Publish
              Resource: !Ref OperationsTopic
            - Sid: BedrockEmbed
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"

  # --- catalog: GET /catalog + GET /catalog/{id}/lineage.
  CatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-catalog"
      CodeUri: src/functions/catalog/
      Handler: app.handler
      MemorySize: 512
      Timeout: 30
      Layers: [!Ref CommonLayer]
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Policies:
        - Statement:
            - Sid: DbSecretRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn
            - Sid: KmsDecrypt
              Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt AppKey.Arn
      Events:
        ListCatalog:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /catalog
        GetLineage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /catalog/{id}/lineage

  # --- analytics: POST /analytics/run + GET /analytics/{run_id}. Topic model
  #     over curated abstracts - the heavy one (1024 MB / 120 s).
  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-analytics"
      CodeUri: src/functions/analytics/
      Handler: app.handler
      MemorySize: 1024
      Timeout: 120
      Layers: [!Ref CommonLayer]
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Policies:
        - Statement:
            - Sid: DbSecretRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn
            - Sid: KmsDecrypt
              Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt AppKey.Arn
            - Sid: BedrockModels
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
      Events:
        RunAnalytics:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /analytics/run
        GetAnalytics:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /analytics/{run_id}

  # --- dashboard: GET /dashboard - one round trip: KPI tiles + every chart
  #     series, shaped to frontend/lib/types.ts::DashboardResponse.
  DashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-dashboard"
      CodeUri: src/functions/dashboard/
      Handler: app.handler
      MemorySize: 512
      Timeout: 30
      Layers: [!Ref CommonLayer]
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Policies:
        - Statement:
            - Sid: DbSecretRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn
            - Sid: KmsDecrypt
              Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt AppKey.Arn
      Events:
        GetDashboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /dashboard

  # --- summarize: GET /anomalies + the weekly executive summary (Bedrock Nova
  #     Lite) generated on direct invoke ({"action": "weekly_summary"}).
  #     GET /dashboard is served by DashboardFunction above (its response is
  #     the locked frontend contract shape).
  SummarizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-summarize"
      CodeUri: src/functions/summarize/
      Handler: app.handler
      MemorySize: 1024
      Timeout: 60
      Layers: [!Ref CommonLayer]
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Policies:
        - Statement:
            - Sid: DbSecretRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn
            - Sid: KmsDecrypt
              Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt AppKey.Arn
            - Sid: BedrockChat
              Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0"
      Events:
        GetAnomalies:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /anomalies

  # --- rag_chat: POST /chat - RAG over curated grants via Bedrock (in-boundary
  #     only: Nova Lite chat + Titan v2 embeddings, per CONTRACTS).
  RagChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-rag-chat"
      CodeUri: src/functions/rag_chat/
      Handler: app.handler
      MemorySize: 1024
      Timeout: 60
      Layers: [!Ref CommonLayer]
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Policies:
        - Statement:
            - Sid: DbSecretRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn
            - Sid: KmsDecrypt
              Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt AppKey.Arn
            - Sid: BedrockModels
              Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
      Events:
        PostChat:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /chat

  # --- public_intelligence: verified public-evidence snapshot plus grounded
  #     explanations. This function is outside the synthetic portfolio VPC and
  #     database path. It reads only the dedicated S3 prefix, verifies the
  #     manifest and index digests, and makes at most one bounded Bedrock call.
  PublicIntelligenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-public-intelligence"
      CodeUri: src/functions/public_intelligence/
      Handler: app.handler
      MemorySize: 768
      Timeout: 45
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          PUBLIC_INTELLIGENCE_BUCKET: !If
            - EnableScaleFeature
            - !Ref ScaleDataLakeBucket
            - !Ref RawBucket
          PUBLIC_INTELLIGENCE_PREFIX: public-intelligence/
          PUBLIC_INTELLIGENCE_MANIFEST_KEY: public-intelligence/current/manifest.json
          PUBLIC_INTELLIGENCE_MAX_INDEX_BYTES: "1572864"
          PUBLIC_INTELLIGENCE_READ_ROLES: poweruser,viewer
          PUBLIC_INTELLIGENCE_EXPLAIN_ROLES: poweruser,viewer
          PUBLIC_SBIR_EXECUTION_BUCKET: !Ref RawBucket
          PUBLIC_SBIR_EXECUTION_PREFIX: mlops/public-sbir-transition/executions/
          PUBLIC_SBIR_EXECUTION_ENABLED: !Ref PublicSbirExecutionEnabled
          PUBLIC_SBIR_CANDIDATE_POOL_KEY: mlops/public-sbir-transition/validation/current-public-phase-i-20260812.json
          PUBLIC_SBIR_CANDIDATE_POOL_SHA256: 45df1368c1dced57ee99bb16f74ce2d8596587a4a177462011394b1526ee5aba
          PUBLIC_SBIR_MODEL_PACKAGE_GROUP_ARN: !Ref PublicSbirTransitionModelPackageGroup
          PUBLIC_SBIR_MODEL_PACKAGE_ARN: !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:model-package/${AWS::StackName}-public-sbir-transition/2"
          PUBLIC_SBIR_TRAINING_JOB_ARN: !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:training-job/compass-doc-sbir-transition-20260812-0134"
          PUBLIC_SBIR_MODEL_ARTIFACT_SHA256: 652665a26f65230c2eb6019c65ca706bdb248414ed71b8d3365a05431045fd0a
          PUBLIC_SBIR_MODEL_BUNDLE_SHA256: 51a3fcc71c46ecb514b2c3866f5153f7771838d07b43fc0807f4a89a5d6b424b
          PUBLIC_SBIR_MODEL_CARD_SHA256: 5f2a26edfd17035054d6e056be9bdc41dd2781958825eb10910ab5322d8a5bc4
          PUBLIC_SBIR_MODEL_DATA_KEY: mlops/public-sbir-transition/registry/sbir_transition-0dda670313a1e9d3/model-v2.tar.gz
          PUBLIC_SBIR_MODEL_DATA_VERSION_ID: 6ki61OUXqpqujj5uHes3k0Sz2AoryxlB
          PUBLIC_SBIR_IMAGE_DIGEST: sha256:b77026dc1972b759579139314c03482103809a80fa52e2ee696c52e1270a626d
          PUBLIC_SBIR_EXECUTION_ROLE_ARN: !GetAtt DocumentSageMakerExecutionRole.Arn
          PUBLIC_SBIR_EXECUTION_KMS_KEY_ARN: !GetAtt AppKey.Arn
          PUBLIC_SBIR_EXECUTION_MAX_RECORDS: "25"
          PUBLIC_SBIR_EXECUTION_MAX_RUNTIME_SECONDS: "1800"
          PUBLIC_SBIR_RECONCILIATION_ROLE_ARN: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-sbir-scheduler"
          PUBLIC_SBIR_RECONCILIATION_FUNCTION_ARN: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-public-intelligence"
          PUBLIC_SBIR_RECONCILIATION_DLQ_ARN: !GetAtt PublicSbirReconciliationDeadLetterQueue.Arn
          PUBLIC_SBIR_M5_LARGE_PRICE_USD_HOUR: "0.115"
          OPERATIONS_TABLE: !Ref OperationsTable
          OPERATIONS_TOPIC_ARN: !Ref OperationsTopic
      Policies:
        - Statement:
            - Sid: ReadVerifiedPublicEvidence
              Effect: Allow
              Action: s3:GetObject
              Resource: !If
                - EnableScaleFeature
                - !Sub "${ScaleDataLakeBucket.Arn}/public-intelligence/*"
                - !Sub "${RawBucket.Arn}/public-intelligence/*"
            - Sid: ReadPublicSbirValidationPool
              Effect: Allow
              Action: [s3:GetObject, s3:GetObjectVersion]
              Resource: !Sub "${RawBucket.Arn}/mlops/public-sbir-transition/validation/*"
            - Sid: ReadPinnedPublicSbirModelArtifact
              Effect: Allow
              Action: [s3:GetObject, s3:GetObjectVersion]
              Resource: !Sub "${RawBucket.Arn}/mlops/public-sbir-transition/registry/sbir_transition-0dda670313a1e9d3/model-v2.tar.gz"
            - Sid: GovernPublicSbirExecutionReceipts
              Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
              Resource: !Sub "${RawBucket.Arn}/mlops/public-sbir-transition/executions/*"
            - Sid: ListPublicSbirExecutionHistory
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt RawBucket.Arn
              Condition:
                StringLike:
                  s3:prefix:
                    - mlops/public-sbir-transition/executions/history/*
                    - mlops/public-sbir-transition/executions/control/*
            - Sid: EncryptPublicEvidenceAndExecution
              Effect: Allow
              Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
              Resource: !GetAtt AppKey.Arn
            - Sid: ReadPublicSbirCandidate
              Effect: Allow
              Action: sagemaker:DescribeModelPackage
              Resource: !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:model-package/${AWS::StackName}-public-sbir-transition/2"
            - Sid: ExecuteBoundedPublicSbirTransform
              Effect: Allow
              Action:
                - sagemaker:CreateTransformJob
                - sagemaker:DescribeTransformJob
                - sagemaker:StopTransformJob
                - sagemaker:AddTags
              Resource: !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:transform-job/sbir-batch-*"
            - Sid: ManageEphemeralPublicSbirModel
              Effect: Allow
              Action: [sagemaker:CreateModel, sagemaker:DeleteModel, sagemaker:AddTags]
              Resource: !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:model/compass-sbir-*"
            - Sid: PassPublicSbirExecutionRole
              Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt DocumentSageMakerExecutionRole.Arn
              Condition:
                StringEquals:
                  iam:PassedToService: sagemaker.amazonaws.com
            - Sid: SchedulePublicSbirReconciliation
              Effect: Allow
              Action: [scheduler:CreateSchedule, scheduler:DeleteSchedule]
              Resource: !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${AWS::StackName}-public-intelligence-sbir-*"
            - Sid: PassPublicSbirReconciliationRole
              Effect: Allow
              Action: iam:PassRole
              Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-sbir-scheduler"
              Condition:
                StringEquals:
                  iam:PassedToService: scheduler.amazonaws.com
            - Sid: GenerateGroundedPublicExplanation
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0"
            - Sid: WritePublicModelOperationalEvidence
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt OperationsTable.Arn
            - Sid: PublishPublicModelSignals
              Effect: Allow
              Action: sns:Publish
              Resource: !Ref OperationsTopic
      Events:
        GetPublicIntelligenceSnapshot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /public-intelligence/snapshot
        ExplainPublicIntelligence:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /public-intelligence/explain
        StartPublicSbirModelExecution:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /public-intelligence/model-executions
        ListPublicSbirModelExecutions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /public-intelligence/model-executions
        GetPublicSbirModelExecution:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /public-intelligence/model-executions/{executionId}

  PublicSbirReconciliationSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-sbir-scheduler"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default"
      Policies:
        - PolicyName: invoke-public-sbir-reconciler
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PublicIntelligenceFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt PublicSbirReconciliationDeadLetterQueue.Arn
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !GetAtt AppKey.Arn

  # Approvals: shared pending inbox plus request and decision actions.
  ApprovalsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-approvals"
      CodeUri: src/functions/approvals/
      Handler: app.handler
      MemorySize: 512
      Timeout: 15
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          APPROVAL_REQUIRE_FOUR_EYES: "true"
          APPROVAL_TTL_SECONDS: "3600"
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Policies:
        - Statement:
            - Sid: DbSecretRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn
            - Sid: KmsDecrypt
              Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt AppKey.Arn
      Events:
        GetApprovals:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /approvals
        PostApprovals:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /approvals

  # --- license: GET /licenses - license lifecycle table.
  LicenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-license"
      CodeUri: src/functions/license/
      Handler: app.handler
      MemorySize: 512
      Timeout: 15
      Layers: [!Ref CommonLayer]
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Policies:
        - Statement:
            - Sid: DbSecretRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn
            - Sid: KmsDecrypt
              Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt AppKey.Arn
      Events:
        GetLicenses:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /licenses

  # --- export: POST /export (RLS/CLS + aggregation guard + audit_log) and
  #     GET /openapi.json (the served OpenAPI 3.1 contract - element 7).
  ExportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-export"
      CodeUri: src/functions/export/
      Handler: app.handler
      MemorySize: 1024
      Timeout: 120
      Layers: [!Ref CommonLayer]
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Environment:
        Variables:
          EXPORT_MAX_ROWS: !Ref ExportMaxRows
          EXPORT_BUCKET: !Ref RawBucket   # large exports land under exports/
      Policies:
        - Statement:
            - Sid: DbSecretRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn
            - Sid: KmsForDataPlane
              Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey]
              Resource: !GetAtt AppKey.Arn
            - Sid: ExportPrefixRW
              Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${RawBucket.Arn}/exports/*"
      Events:
        PostExport:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /export
        GetOpenApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /openapi.json

  # --- evidence: protected read-only projections for the in-app System
  #     Inspector. The response intentionally excludes infrastructure names,
  #     secrets, raw claims, source records, SQL, prompts, and exceptions.
  EvidenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-evidence"
      CodeUri: src/functions/evidence/
      Handler: app.handler
      MemorySize: 512
      Timeout: 30
      Layers: [!Ref CommonLayer]
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Policies:
        - Statement:
            - Sid: DbSecretRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn
            - Sid: KmsDecrypt
              Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt AppKey.Arn
      Events:
        GetSystemEvidence:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /system/evidence

  # --- rmf_artifact: generates RMF/ATO evidence artifacts from the live stack
  #     (direct invoke; no API route in CONTRACTS).
  RmfArtifactFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-rmf-artifact"
      CodeUri: src/functions/rmf_artifact/
      Handler: app.handler
      MemorySize: 1024
      Timeout: 120
      Layers: [!Ref CommonLayer]
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Policies:
        - Statement:
            - Sid: DbSecretRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn
            - Sid: KmsForDataPlane
              Effect: Allow
              Action: [kms:Decrypt, kms:GenerateDataKey]
              Resource: !GetAtt AppKey.Arn
            - Sid: RmfArtifactWrite
              Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${RawBucket.Arn}/rmf/*"
            - Sid: BedrockChat
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0"

  # --- migrator: in-VPC SQL runner that applies db/migrations against the
  #     private cluster as the owner role (invoke directly; no API route).
  MigratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-migrator"
      CodeUri: src/functions/migrator/
      Handler: app.handler
      MemorySize: 512
      Timeout: 300
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          DEMO_FIXTURE_BUCKET: !Ref RawBucket
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Policies:
        - Statement:
            - Sid: DbSecretRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !GetAtt DbCluster.MasterUserSecret.SecretArn
            - Sid: KmsDecrypt
              Effect: Allow
              Action: kms:Decrypt
              Resource: !GetAtt AppKey.Arn
            - Sid: DemoFixtureRead
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${RawBucket.Arn}/demo-stage/*"

  # --- optional Scale Run control plane: bounded planning, launch, progress,
  #     Athena conversion, finalization, cancellation, and export requests.
  ScaleControlFunction:
    Type: AWS::Serverless::Function
    Condition: EnableScaleFeature
    Properties:
      FunctionName: !Sub "${AWS::StackName}-scale-control"
      CodeUri: src/functions/scale_runs/
      Handler: app.handler
      MemorySize: 1024
      Timeout: 300
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          SCALE_FEATURE_ENABLED: "true"
          SCALE_MAX_RECORDS: !Ref ScaleMaxRecords
          SCALE_MAX_ESTIMATED_COST_USD: !Ref ScaleMaxEstimatedCostUsd
          SCALE_MAX_CONCURRENCY: !Ref ScaleMaxConcurrency
          SCALE_DATA_RETENTION_DAYS: !Ref ScaleDataRetentionDays
          SCALE_EVIDENCE_RETENTION_DAYS: !Ref ScaleEvidenceRetentionDays
          SCALE_ATHENA_BYTES_SCANNED_CUTOFF: !Ref ScaleAthenaBytesScannedCutoff
          SCALE_RUNS_TABLE: !Ref ScaleRunsTable
          SCALE_QUEUE_URL: !Ref ScaleWorkerQueue
          SCALE_DLQ_URL: !Ref ScaleWorkerDeadLetterQueue
          SCALE_EXPORT_QUEUE_URL: !Ref ScaleExportQueue
          SCALE_LAKE_BUCKET: !Ref ScaleDataLakeBucket
          SCALE_GLUE_DATABASE: !Ref ScaleGlueDatabase
          SCALE_ATHENA_WORKGROUP: !Ref ScaleAthenaWorkGroup
          # Name-derived ARN avoids a circular dependency: the state machine
          # invokes this function while this function starts the state machine.
          SCALE_STATE_MACHINE_ARN: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-scale-run"
      Policies:
        - Statement:
            - Sid: ScaleLedgerReadWrite
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:BatchWriteItem
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt ScaleRunsTable.Arn
                - !Sub "${ScaleRunsTable.Arn}/index/*"
            - Sid: ScaleQueueDispatchAndEvidence
              Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:SendMessageBatch
                - sqs:GetQueueAttributes
                - sqs:GetQueueUrl
              Resource:
                - !GetAtt ScaleWorkerQueue.Arn
                - !GetAtt ScaleWorkerDeadLetterQueue.Arn
                - !GetAtt ScaleExportQueue.Arn
            - Sid: StartScaleRunWorkflow
              Effect: Allow
              Action: states:StartExecution
              Resource: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-scale-run"
            - Sid: ScaleLakeList
              Effect: Allow
              Action:
                - s3:ListBucket
                - s3:GetBucketLocation
              Resource: !GetAtt ScaleDataLakeBucket.Arn
            - Sid: ScaleLakeReadWrite
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:AbortMultipartUpload
                - s3:ListMultipartUploadParts
              Resource: !Sub "${ScaleDataLakeBucket.Arn}/*"
            - Sid: ScaleAthenaQueries
              Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:GetWorkGroup
                - athena:StopQueryExecution
              Resource: !Sub "arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${ScaleAthenaWorkGroup}"
            - Sid: ScaleGlueCatalogRead
              Effect: Allow
              Action:
                - glue:GetDatabase
                - glue:GetDatabases
                - glue:GetTable
                - glue:GetTables
                - glue:GetTableVersion
                - glue:GetTableVersions
                - glue:GetPartition
                - glue:GetPartitions
              Resource:
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${ScaleGlueDatabase}"
                - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${ScaleGlueDatabase}/*"
            - Sid: ScaleLakeFormationDataAccess
              Effect: Allow
              Action: lakeformation:GetDataAccess
              Resource: "*"
            - Sid: ScaleDataKeyUse
              Effect: Allow
              Action:
                - kms:Decrypt
                - kms:Encrypt
                - kms:GenerateDataKey
                - kms:DescribeKey
              Resource: !GetAtt AppKey.Arn
      Events:
        GetScaleProfiles:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /scale/profiles
        CreateScalePlan:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /scale/plans
        ListScaleRuns:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /scale/runs
        CreateScaleRun:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /scale/runs
        GetScaleRun:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /scale/runs/{run_id}
        CancelScaleRun:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /scale/runs/{run_id}/cancel
        CreateScaleExport:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /scale/runs/{run_id}/exports
        GetScaleExport:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /scale/runs/{run_id}/exports/{export_id}

  ScaleLakeDatabasePermissions:
    Type: AWS::LakeFormation::PrincipalPermissions
    Condition: EnableScaleFeature
    DependsOn:
      - ScaleControlFunction
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !GetAtt ScaleControlFunctionRole.Arn
      Resource:
        Database:
          CatalogId: !Ref AWS::AccountId
          Name: !Ref ScaleGlueDatabase
      Permissions:
        - DESCRIBE
      PermissionsWithGrantOption: []

  ScaleLakeTablePermissions:
    Type: AWS::LakeFormation::PrincipalPermissions
    Condition: EnableScaleFeature
    DependsOn:
      - ScaleControlFunction
    Properties:
      Principal:
        DataLakePrincipalIdentifier: !GetAtt ScaleControlFunctionRole.Arn
      Resource:
        Table:
          CatalogId: !Ref AWS::AccountId
          DatabaseName: !Ref ScaleGlueDatabase
          TableWildcard: {}
      Permissions:
        - DESCRIBE
        - SELECT
      PermissionsWithGrantOption: []

  # --- optional Scale Run partition worker. It is deliberately outside the
  #     VPC because it touches only SQS, DynamoDB, S3, KMS, and local scratch.
  ScaleWorkerFunction:
    Type: AWS::Serverless::Function
    Condition: EnableScaleFeature
    Properties:
      FunctionName: !Sub "${AWS::StackName}-scale-worker"
      CodeUri: src/functions/scale_worker/
      Handler: app.handler
      MemorySize: 2048
      Timeout: 900
      ReservedConcurrentExecutions: !Ref ScaleMaxConcurrency
      EphemeralStorage:
        Size: 2048
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          SCALE_RUNS_TABLE: !Ref ScaleRunsTable
          SCALE_LAKE_BUCKET: !Ref ScaleDataLakeBucket
          SCALE_DATA_RETENTION_DAYS: !Ref ScaleDataRetentionDays
          SCALE_WORKER_MAX_RECEIVE_COUNT: "3"
      Policies:
        - Statement:
            - Sid: ScalePartitionLedger
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt ScaleRunsTable.Arn
            - Sid: ScalePartitionObjects
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:AbortMultipartUpload
              Resource: !Sub "${ScaleDataLakeBucket.Arn}/*"
            - Sid: ConsumeScaleWorkerQueue
              Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:ChangeMessageVisibility
                - sqs:GetQueueAttributes
              Resource: !GetAtt ScaleWorkerQueue.Arn
            - Sid: ScaleWorkerDataKeyUse
              Effect: Allow
              Action:
                - kms:Decrypt
                - kms:Encrypt
                - kms:GenerateDataKey
              Resource: !GetAtt AppKey.Arn
      Events:
        PartitionQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt ScaleWorkerQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: !Ref ScaleMaxConcurrency

  # --- optional asynchronous lake export worker. Export messages contain only
  #     a run identifier and export identifier; the ledger owns every choice.
  ScaleExportFunction:
    Type: AWS::Serverless::Function
    Condition: EnableScaleFeature
    Properties:
      FunctionName: !Sub "${AWS::StackName}-scale-export"
      CodeUri: src/functions/scale_export/
      Handler: app.handler
      MemorySize: 1024
      Timeout: 900
      ReservedConcurrentExecutions: !Ref ScaleExportConcurrency
      EphemeralStorage:
        Size: 2048
      Layers: [!Ref CommonLayer]
      Environment:
        Variables:
          SCALE_RUNS_TABLE: !Ref ScaleRunsTable
          SCALE_LAKE_BUCKET: !Ref ScaleDataLakeBucket
      Policies:
        - Statement:
            - Sid: ScaleExportLedger
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
              Resource: !GetAtt ScaleRunsTable.Arn
            - Sid: ScaleExportLakeList
              Effect: Allow
              Action:
                - s3:ListBucket
                - s3:GetBucketLocation
              Resource: !GetAtt ScaleDataLakeBucket.Arn
            - Sid: ScaleExportLakeObjects
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:AbortMultipartUpload
              Resource: !Sub "${ScaleDataLakeBucket.Arn}/*"
            - Sid: ConsumeScaleExportQueue
              Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:ChangeMessageVisibility
                - sqs:GetQueueAttributes
              Resource: !GetAtt ScaleExportQueue.Arn
            - Sid: ScaleExportDataKeyUse
              Effect: Allow
              Action:
                - kms:Decrypt
                - kms:Encrypt
                - kms:GenerateDataKey
              Resource: !GetAtt AppKey.Arn
      Events:
        ExportQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt ScaleExportQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: !Ref ScaleExportConcurrency

  ScaleRunStateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: EnableScaleFeature
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/states/${AWS::StackName}-scale-run"
      RetentionInDays: 14

  ScaleRunStateMachine:
    Type: AWS::Serverless::StateMachine
    Condition: EnableScaleFeature
    Properties:
      Name: !Sub "${AWS::StackName}-scale-run"
      Type: STANDARD
      DefinitionUri: statemachines/scale_run.asl.yaml
      DefinitionSubstitutions:
        ScaleControlFunctionArn: !GetAtt ScaleControlFunction.Arn
      Logging:
        Level: ALL
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt ScaleRunStateMachineLogGroup.Arn
      Tracing:
        Enabled: true
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref ScaleControlFunction }
        - Statement:
            - Sid: ScaleWorkflowLogDelivery
              Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: "*"
            - Sid: ScaleWorkflowTracing
              Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
                - xray:GetSamplingRules
                - xray:GetSamplingTargets
              Resource: "*"

  # ===========================================================================
  # (9) Intake pipeline - Express state machine (intake -> quality gate) fired
  #     by EventBridge only for objects under the raw bucket's drops/ prefix.
  # ===========================================================================

  IntakeStateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/states/${AWS::StackName}-intake"
      RetentionInDays: 14

  IntakeStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-intake"
      Type: EXPRESS
      DefinitionUri: statemachines/intake.asl.yaml
      DefinitionSubstitutions:
        IntakeFunctionArn: !GetAtt IntakeFunction.Arn
        QualityGateFunctionArn: !GetAtt QualityGateFunction.Arn
      Logging:
        Level: ALL
        # Input includes a physical object locator. Stage and outcome logs stay
        # enabled, while raw execution data stays out of log summaries.
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt IntakeStateMachineLogGroup.Arn
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref IntakeFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref QualityGateFunction }
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: "*"

  DocumentMlStateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/states/${AWS::StackName}-document-ml"
      RetentionInDays: 14

  DocumentMlStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${AWS::StackName}-document-ml"
      Type: EXPRESS
      DefinitionUri: statemachines/document_ml.asl.yaml
      DefinitionSubstitutions:
        DocumentMlFunctionArn: !GetAtt DocumentMlFunction.Arn
      Logging:
        Level: ALL
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt DocumentMlStateMachineLogGroup.Arn
      Tracing:
        Enabled: true
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref DocumentMlFunction }
        - Statement:
            - Sid: DocumentWorkflowLogDelivery
              Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: "*"
            - Sid: DocumentWorkflowTracing
              Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
                - xray:GetSamplingRules
                - xray:GetSamplingTargets
              Resource: "*"

  DocumentEventsToStatesRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-document-state-machine
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref DocumentMlStateMachine

  DocumentObjectCreatedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-document-object-created"
      Description: Browser document drop starts inspect, quality, and curation.
      State: ENABLED
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket:
            name: [!Ref RawBucket]
          object:
            key:
              - prefix: documents/incoming/
      Targets:
        - Id: document-ml-state-machine
          Arn: !Ref DocumentMlStateMachine
          RoleArn: !GetAtt DocumentEventsToStatesRole.Arn

  EventsToStatesRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-intake-state-machine
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref IntakeStateMachine

  RawObjectCreatedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-raw-object-created"
      Description: Raw grant file landed in S3 -> start the intake pipeline.
      State: ENABLED
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket:
            name: [!Ref RawBucket]
          object:
            key:
              - prefix: drops/
      Targets:
        - Id: intake-state-machine
          Arn: !Ref IntakeStateMachine
          RoleArn: !GetAtt EventsToStatesRole.Arn

  # ===========================================================================
  # (10) Operational evidence: bounded log retention, service alarms, and a
