                "period": 60,
                "stat": "Sum",
                "metrics": [
                  [{"expression": "SEARCH('{Compass/Scale} MetricName=\"Records\"', 'Sum', 60)", "label": "Records", "id": "e1"}],
                  [{"expression": "SEARCH('{Compass/Scale} MetricName=\"InvalidRecords\"', 'Sum', 60)", "label": "Invalid records", "id": "e2"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Partition and export queue pressure",
                "region": "${AWS::Region}",
                "period": 60,
                "stat": "Maximum",
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${ScaleWorkerQueue.QueueName}"],
                  [".", "ApproximateNumberOfMessagesNotVisible", ".", "."],
                  [".", "ApproximateAgeOfOldestMessage", ".", "."],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${ScaleExportQueue.QueueName}"]
                ]
