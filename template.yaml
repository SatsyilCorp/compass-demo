  # ===========================================================================
  # (11) Web tier - private S3 + OAC + CloudFront (PriceClass_100) with the
  #      Next.js trailing-slash path-rewrite function (proven pattern from a prior static-export deployment),
  #      fronted by the CLOUDFRONT-scope WAF WebACL below.
  # ===========================================================================

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-web-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt AppKey.Arn
            BucketKeyEnabled: true

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebSecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-web-security-headers"
        Comment: Browser security baseline for the Compass static application
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'self'; base-uri 'self'; object-src 'none';
              frame-ancestors 'none'; form-action 'self' https://*.amazoncognito.com;
              script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';
              img-src 'self' data:; font-src 'self' data:;
              connect-src 'self' https://*.amazoncognito.com
              https://cognito-idp.us-east-1.amazonaws.com
              https://*.execute-api.us-east-1.amazonaws.com;
              manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: >-
                camera=(), microphone=(), geolocation=(), payment=(), usb=(),
                browsing-topics=()
              Override: true

  # Maps trailing-slash + extensionless URLs (/catalog/, /dashboard) to the
  # underlying /foo/index.html object in S3. Without this, every Next.js
  # static-export route 404s in S3. (Working function proven in a prior static-export deployment.)
  WebPathRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-path-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Map trailing-slash + extensionless paths to /index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            var uri = request.uri;
            if (uri.endsWith('/')) {
                request.uri += 'index.html';
            } else if (uri.indexOf('.') === -1) {
                request.uri += '/index.html';
            }
            return request;
        }

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Compass demo web - Next.js static export
        Aliases: !If
          - HasWebCustomDomain
          - - !Ref WebCustomDomainName
          - !Ref AWS::NoValue
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        WebACLId: !GetAtt WebAcl.Arn
        Origins:
          - Id: web-s3-origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: web-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          ResponseHeadersPolicyId: !Ref WebSecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WebPathRewriteFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        ViewerCertificate: !If
          - HasWebCustomDomain
          - AcmCertificateArn: !Ref WebCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true

  WebCustomDomainRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasWebCustomDomain
    Properties:
      HostedZoneId: !Ref WebHostedZoneId
      Name: !Ref WebCustomDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt WebDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution.Id}"

  # ===========================================================================
  # (11) WAF - CLOUDFRONT-scope WebACL (this is why the stack is pinned to
  #      us-east-1): AWS managed common rules + per-IP rate rule, associated
  #      to the distribution via WebACLId above. Always deployed.
  # ===========================================================================

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${AWS::StackName}-web-acl"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AWS::StackName}-web-acl"
      Rules:
        - Name: RateLimitPerIp
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimit
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPerIp
        - Name: AWSCommonRules
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSCommonRules

  # ===========================================================================
  # (12) OPTIONAL account-singleton detectors - GuardDuty + Security Hub +
  #      Macie, gated behind DeploySecurityBaseline (default false: only ONE
  #      stack per account may own these).
  # ===========================================================================

  GuardDutyDetector:
    Type: AWS::GuardDuty::Detector
    Condition: EnableSecurityBaseline
    Properties:
      Enable: true
      FindingPublishingFrequency: SIX_HOURS

  SecurityHub:
    Type: AWS::SecurityHub::Hub
    Condition: EnableSecurityBaseline
    Properties: {}

  MacieSession:
    Type: AWS::Macie::Session
    Condition: EnableSecurityBaseline
    Properties:
      FindingPublishingFrequency: SIX_HOURS
      Status: ENABLED

# -----------------------------------------------------------------------------
# Outputs
# -----------------------------------------------------------------------------
Outputs:
  ScaleFeatureStatus:
    Description: Whether the optional, cost-bounded Scale Run data plane is deployed.
    Value: !If [EnableScaleFeature, enabled, disabled]
  ApiBaseUrl:
    Description: HttpApi base URL (JWT-guarded, deny-by-default).
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  CloudFrontDomain:
    Description: CloudFront domain - feed back into WebCallbackUrl/WebLogoutUrl/WebOrigin on the second deploy.
    Value: !GetAtt WebDistribution.DomainName
  CustomDomainUrl:
    Condition: HasWebCustomDomain
    Description: Stable custom URL for the Compass web application.
    Value: !Sub "https://${WebCustomDomainName}"
  UserPoolId:
    Description: Cognito user pool id.
    Value: !Ref UserPool
  WebClientId:
    Description: Cognito web app client id.
    Value: !Ref WebClient
  CognitoDomain:
    Description: Cognito hosted UI domain.
    Value: !Sub "${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  WebBucketName:
    Description: Private S3 bucket for the Next.js static export.
    Value: !Ref WebBucket
  WebDistributionId:
    Description: CloudFront distribution id (for cache invalidation on deploy).
    Value: !GetAtt WebDistribution.Id
  DbSecretArn:
    Description: RDS-managed master secret ({"username","password"}) for the Aurora cluster.
    Value: !GetAtt DbCluster.MasterUserSecret.SecretArn
  DbClusterEndpoint:
    Description: Aurora writer endpoint (DB_HOST for local tooling).
    Value: !GetAtt DbCluster.Endpoint.Address
  RawBucketName:
    Description: Raw landing-zone bucket (drop a file to fire the intake pipeline).
    Value: !Ref RawBucket
  TickerStreamName:
    Description: On-demand Kinesis stream backing the ingest ticker.
    Value: !Ref TickerStream
  IntakeStateMachineArn:
    Description: Express intake pipeline (intake -> quality gate).
    Value: !Ref IntakeStateMachine
  DocumentMlStateMachineArn:
    Description: Express document pipeline (inspect -> quality -> silver/gold or quarantine).
    Value: !Ref DocumentMlStateMachine
  DocumentMlTableName:
    Description: Durable document run, model registry, deployment, and drift receipt ledger.
    Value: !Ref DocumentMlTable
  OperationsTableName:
    Description: Durable operational stage, public acquisition, and notification receipt ledger.
    Value: !Ref OperationsTable
  OperationsTopicArn:
    Description: Encrypted operational alert topic. Email delivery requires a confirmed subscription.
    Value: !Ref OperationsTopic
  PublicAcquisitionFunctionName:
    Description: Scheduled, bounded USAspending public evidence acquisition function.
    Value: !Ref PublicAcquisitionFunction
  DocumentModelPackageGroupName:
    Description: SageMaker Model Registry group reserved for approved document model packages.
    Value: !Ref DocumentModelPackageGroup
  PublicFundingModelPackageGroupName:
    Description: SageMaker Model Registry group ARN for public funding forecast candidates.
    Value: !If
      - CreatePublicFundingModelPackageGroup
      - !Ref PublicFundingModelPackageGroup
      - !Ref ExistingPublicFundingModelPackageGroupArn
  PublicSbirTransitionModelPackageGroupName:
    Description: SageMaker Model Registry group ARN for public SBIR transition candidates.
    Value: !Ref PublicSbirTransitionModelPackageGroup
  DocumentMlFunctionName:
    Description: Protected document and MLOps control function.
    Value: !Ref DocumentMlFunction
  MigratorFunctionName:
    Description: Invoke in-VPC to apply db/migrations against the private cluster.
    Value: !Ref MigratorFunction
  AnalyticsFunctionName:
    Description: Direct-invoke function used for controlled baseline analytics preparation.
    Value: !Ref AnalyticsFunction
  ScaleRunsFunctionName:
    Condition: EnableScaleFeature
    Description: Protected Scale Plan, Scale Run, and evidence control function.
    Value: !Ref ScaleControlFunction
  ScaleRunStateMachineArn:
    Condition: EnableScaleFeature
    Description: Standard workflow coordinating one bounded Scale Run.
    Value: !Ref ScaleRunStateMachine
  ScaleDataLakeBucketName:
    Condition: EnableScaleFeature
    Description: Private, encrypted synthetic Scale Run data lake bucket.
    Value: !Ref ScaleDataLakeBucket
  ScaleRunsTableName:
    Condition: EnableScaleFeature
    Description: Durable Scale Plan, run, partition, and export ledger.
    Value: !Ref ScaleRunsTable
  ScaleAthenaWorkGroupName:
    Condition: EnableScaleFeature
    Description: Query workgroup with the enforced Scale Run scan cutoff.
    Value: !Ref ScaleAthenaWorkGroup
