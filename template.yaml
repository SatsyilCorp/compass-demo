AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Compass - US Navy/ONR S&T Portfolio Intelligence demo (single stack,
  us-east-1). Everything is created in-template for reproducibility: a minimal
  VPC + Aurora Serverless v2 PostgreSQL (RLS-enforced), Cognito (per-user MFA
  optional so team accounts stay password-only and a presenter proves TOTP)
  with a JWT-guarded HttpApi, one Lambda per src/functions dir on a
  shared CommonLayer, an Express intake state machine fired by S3 -> EventBridge,
  an on-demand Kinesis ticker stream, a private S3 + CloudFront web tier behind
  a CLOUDFRONT-scope WAF, and a customer-managed KMS key over data at rest.
  The core portfolio uses synthetic data. The isolated public-intelligence
  adapter can serve checksummed, PII-minimized public evidence. No CUI is used.
  NOTE: the WAF WebACL is Scope CLOUDFRONT, so this stack MUST deploy in
  us-east-1 (pinned in samconfig.toml).

# -----------------------------------------------------------------------------
# Parameters
# -----------------------------------------------------------------------------
Parameters:

  WebCallbackUrl:
    Type: String
    Default: ""
    Description: >
      Deployed OAuth callback URL. The SPA (react-oidc-context, trailingSlash
      static export) uses /login/ as its redirect_uri, so use e.g.
      https://dXXXX.cloudfront.net/login/. Empty on the FIRST deploy
      (CloudFront domain not yet known); fill it in samconfig.toml and
      redeploy. http://localhost:3000/login/ is always registered for local dev.

  WebLogoutUrl:
    Type: String
    Default: ""
    Description: >
      Deployed post-logout return URL, e.g. https://dXXXX.cloudfront.net/login/.
      Same two-deploy dance as WebCallbackUrl.

  WebOrigin:
    Type: String
    Default: ""
    Description: >
      Deployed web origin for API CORS, e.g. https://dXXXX.cloudfront.net.
      Empty on the first deploy; http://localhost:3000 is always allowed.

  WebCustomDomainName:
    Type: String
    Default: ""
    Description: Optional Route 53 name presented by CloudFront.

  WebCertificateArn:
    Type: String
    Default: ""
    Description: Optional us-east-1 ACM certificate ARN for the custom domain.

  WebHostedZoneId:
    Type: String
    Default: ""
    Description: Optional public Route 53 hosted zone ID for the custom domain.

  CognitoDomainPrefix:
    Type: String
    Default: ""
    Description: >
      Globally-unique Cognito hosted-UI domain prefix. Leave empty to use
      compass-demo-<account-id>.

  ExportMaxRows:
    Type: Number
    Default: 5000
    Description: >
      Aggregation-guard threshold for POST /export - requests above this row
      count return HTTP 428 (approval required) unless an approval token is
      attached (see docs/CONTRACTS.md).

  WafRateLimit:
    Type: Number
    Default: 2000
    Description: 5-minute request cap per source IP on the WAF rate rule.

  StreamTickerState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >
      EventBridge schedule that invokes the intake Lambda once a minute to
      publish synthetic ticker records onto the Kinesis stream. DISABLED
      switches the ticker off between demos.

  PublicAcquisitionState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >
      Five-minute, bounded USAspending public-source poll. Accepted deltas are
      published onto Kinesis with source, hash, quality, and lineage receipts.

  PublicAcquisitionChangeAlertThreshold:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: Added or changed records that trigger an analyst-review signal.

  NotificationEmail:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    Description: >
      Optional operational notification email. AWS sends a confirmation request;
      email delivery is active only after the recipient confirms the subscription.

  DeploySecurityBaseline:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Toggle GuardDuty + Security Hub + Macie. These are ACCOUNT SINGLETONS:
      only one stack per account may own them, so they default off. The KMS key
      and the CloudFront WAF WebACL are NOT behind this flag; they always deploy.

  DeployRevision:
    Type: String
    Default: local
    Description: Short source revision displayed by the protected System Inspector.

  DatabaseResilienceMode:
    Type: String
    Default: demo
    AllowedValues: [demo, ha]
    Description: Demo keeps one writer; ha adds a cluster reader and deletion protection.

  ScaleFeatureEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Deploy the bounded Scale Run data plane. Disabled by default so the
      existing demonstration stack keeps its current resource and cost posture.

  ScaleMaxRecords:
    Type: Number
    Default: 100000
    AllowedValues: [1000, 10000, 100000, 1000000]
    Description: Hard deployment limit applied by the Scale Run Gate.

  ScaleMaxConcurrency:
    Type: Number
    Default: 4
    MinValue: 2
    MaxValue: 10
    Description: Maximum concurrent partition-worker Lambda invocations.

  ScaleExportConcurrency:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 5
    Description: Maximum concurrent asynchronous Scale Run export jobs.

  ScaleMaxEstimatedCostUsd:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: Server-enforced maximum estimated incremental cost for one Scale Run.

  ScaleDataRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 30
    Description: Retention for generated landing, curated, quarantine, and Parquet objects.

  ScaleEvidenceRetentionDays:
    Type: Number
    Default: 30
    MinValue: 7
    MaxValue: 90
    Description: Retention for compact Scale Run manifests and evidence receipts.

  ScaleAthenaBytesScannedCutoff:
    Type: Number
    Default: 10737418240
    MinValue: 104857600
    MaxValue: 107374182400
    Description: Hard bytes-scanned cutoff applied to every query in the Scale Run workgroup.

  DocumentDataRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: Retention for uploaded, bronze, silver, gold, and quarantine document objects.

  ModelExecutionDataRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 30
    Description: Retention for bounded public-model input, copied model, and output objects.

  PublicSbirExecutionEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Explicit gate for the environment-specific, pinned public SBIR model
      evidence. Leave false on fresh stacks until every referenced artifact,
      package, version, digest, and execution role has been provisioned.

  MlOpsMode:
    Type: String
    Default: demo
    AllowedValues: [demo, sagemaker]
    Description: >
      Demo executes the deterministic classical model in Lambda. SageMaker
      submits a bounded training job only when an approved image is supplied.

  SageMakerTrainingImage:
    Type: String
    Default: ""
    Description: Optional approved ECR training image URI used only in sagemaker mode.

  ExistingPublicFundingModelPackageGroupArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:(aws|aws-us-gov):sagemaker:[a-z0-9-]+:[0-9]{12}:model-package-group/[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
    Description: >
      Optional ARN of an existing public-funding Model Package Group that is
      managed outside this stack. Leave empty on a fresh deployment so this
      stack creates and owns the group. Supplying an ARN references it without
      importing, modifying, or deleting that external resource.

# -----------------------------------------------------------------------------
# Conditions
# -----------------------------------------------------------------------------
Conditions:
  EnableSecurityBaseline: !Equals [!Ref DeploySecurityBaseline, "true"]
  HasWebCallbackUrl: !Not [!Equals [!Ref WebCallbackUrl, ""]]
  HasWebLogoutUrl: !Not [!Equals [!Ref WebLogoutUrl, ""]]
  HasWebOrigin: !Not [!Equals [!Ref WebOrigin, ""]]
  HasWebCustomDomain: !And
    - !Not [!Equals [!Ref WebCustomDomainName, ""]]
    - !Not [!Equals [!Ref WebCertificateArn, ""]]
    - !Not [!Equals [!Ref WebHostedZoneId, ""]]
  HasCognitoDomainPrefix: !Not [!Equals [!Ref CognitoDomainPrefix, ""]]
  EnableDatabaseHa: !Equals [!Ref DatabaseResilienceMode, ha]
  EnableScaleFeature: !Equals [!Ref ScaleFeatureEnabled, "true"]
  CreatePublicFundingModelPackageGroup: !Equals [!Ref ExistingPublicFundingModelPackageGroupArn, ""]
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

# -----------------------------------------------------------------------------
# Globals - every Lambda: python3.11 on arm64, X-Ray on, DB contract env vars
# (see src/common/python/compass_common/config.py for the env-var contract).
# -----------------------------------------------------------------------------
Globals:
  Function:
    # python3.12, not 3.11: Lambda disabled creation of new python3.11
    # functions on 2026-07-31 (cfn-lint E2531), so a fresh deploy of this
    # stack MUST use a newer runtime. All handler code is 3.11-compatible.
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
      LogGroup: !Ref ApplicationFunctionLogGroup
    Environment:
      Variables:
        LOG_LEVEL: INFO
        DB_HOST: !GetAtt DbCluster.Endpoint.Address
        DB_NAME: compass
        DB_SECRET_ARN: !GetAtt DbCluster.MasterUserSecret.SecretArn
        DB_SCHEMA: compass
        BEDROCK_CHAT_MODEL: amazon.nova-lite-v1:0
        BEDROCK_EMBED_MODEL: amazon.titan-embed-text-v2:0
        DEPLOY_REV: !Ref DeployRevision
        CORS_ALLOW_ORIGINS: !If
          - HasWebCustomDomain
          - !If
            - HasWebOrigin
            - !Sub "http://localhost:3000,http://127.0.0.1:3000,${WebOrigin},https://${WebCustomDomainName}"
            - !Sub "http://localhost:3000,http://127.0.0.1:3000,https://${WebCustomDomainName}"
          - !If
            - HasWebOrigin
            - !Sub "http://localhost:3000,http://127.0.0.1:3000,${WebOrigin}"
            - "http://localhost:3000,http://127.0.0.1:3000"

Resources:

  # ===========================================================================
  # (1) Minimal VPC - 2 public + 2 private subnets across two AZs, one NAT.
  #     Private subnets host every DB-touching Lambda and the Aurora cluster;
  #     NAT gives those Lambdas the outbound path to Bedrock / Secrets Manager /
  #     S3 / Kinesis / Step Functions. Created in-template on purpose: the whole
  #     demo must stand up from `sam deploy` alone (reproducibility requirement).
  # ===========================================================================

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-vpc" }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-igw" }

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-public-a" }

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-public-b" }

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-private-a" }

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-private-b" }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-public-rt" }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc

  # One NAT (not one per AZ) - deliberate demo-cost tradeoff, noted honestly:
  # an AZ outage would sever private-subnet egress until repair.
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-nat" }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-private-rt" }

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  DynamoDbGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Compass DB-touching Lambdas (egress only)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: All egress (Aurora, Bedrock, AWS APIs via NAT).
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-lambda-sg" }

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Compass Aurora cluster - PostgreSQL from Lambdas only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: PostgreSQL from the Lambda security group.
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-db-sg" }

  # ===========================================================================
  # (2) Customer-managed KMS key - encrypts the Aurora cluster + its master
  #     secret, both S3 buckets, and the Kinesis stream. Always deployed (NOT
  #     behind DeploySecurityBaseline). The CloudFront statement lets OAC serve
  #     KMS-encrypted web objects; it is account-scoped (not distribution-
  #     scoped) to avoid a key<->distribution circular dependency.
  # ===========================================================================

  AppKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Compass customer-managed key for DB, buckets, stream, secrets.
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountRoot
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: "*"
          - Sid: AllowCloudFrontOacDecrypt
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowOperationalMessaging
            Effect: Allow
            Principal:
              Service:
                - cloudwatch.amazonaws.com
                - sns.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AppKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}"
      TargetKeyId: !Ref AppKey

  # ===========================================================================
  # (3) Aurora Serverless v2 PostgreSQL - created IN-TEMPLATE (reproducibility
  #     requirement). RDS manages the master secret in Secrets Manager
  #     (ManageMasterUserPassword) so no credential ever appears in the
  #     template or samconfig. The migrator Lambda applies db/migrations
  #     (schema `compass`, FORCE RLS, pgvector) as the owner role; app Lambdas
  #     SET ROLE compass_app at connect time (see compass_common.db).
  # ===========================================================================

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Compass private subnets.
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  DbCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      DBClusterIdentifier: !Sub "${AWS::StackName}-db"
      Engine: aurora-postgresql
      EngineVersion: "16.9"
      DatabaseName: compass
      MasterUsername: compass_admin
      ManageMasterUserPassword: true
      MasterUserSecret:
        KmsKeyId: !Ref AppKey
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 4
      StorageEncrypted: true
      KmsKeyId: !Ref AppKey
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DbSecurityGroup
      Port: 5432
      BackupRetentionPeriod: !If [EnableDatabaseHa, 14, 7]
      CopyTagsToSnapshot: true
      DeletionProtection: !If [EnableDatabaseHa, true, false]

  DbInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${AWS::StackName}-db-writer"
      DBClusterIdentifier: !Ref DbCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false

  DbReaderInstance:
    Type: AWS::RDS::DBInstance
    Condition: EnableDatabaseHa
    Properties:
      DBInstanceIdentifier: !Sub "${AWS::StackName}-db-reader"
      DBClusterIdentifier: !Ref DbCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false

  # ===========================================================================
  # (4) Cognito - OPTIONAL TOTP. Team accounts remain password-only; the
  #     dedicated formal presenter account enables TOTP per user.
  #     that map 1:1 to the RLS personas in docs/CONTRACTS.md:
  #       compass-poweruser -> org_unit ONR-Corporate (sees all rows)
  #       compass-viewer    -> org_unit Code-30       (sees Code-30 only)
  # ===========================================================================

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true   # demo personas are seeded, no self-signup
      Policies:
        PasswordPolicy:
          MinimumLength: 16
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !If
        - HasCognitoDomainPrefix
        - !Ref CognitoDomainPrefix
        - !Sub "${AWS::StackName}-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  PowerUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: compass-poweruser
      Description: "Portfolio power user - org_unit ONR-Corporate, sees the whole portfolio"
      UserPoolId: !Ref UserPool
      Precedence: 10

  ViewerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: compass-viewer
      Description: "Program-office viewer - org_unit Code-30, RLS-scoped to Code-30 rows"
      UserPoolId: !Ref UserPool
      Precedence: 20

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-web"
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [openid, email, profile]
      # localhost is always registered; the CloudFront URLs are parameters
      # filled on the SECOND deploy (the domain does not exist until the first).
      # /login/ (with the trailing slash) is the SPA's actual redirect_uri:
      # see frontend/lib/auth/providers.tsx and next.config.ts trailingSlash.
      CallbackURLs: !If
        - HasWebCallbackUrl
        - - http://localhost:3000/login/
          - !Ref WebCallbackUrl
        - - http://localhost:3000/login/
      LogoutURLs: !If
        - HasWebLogoutUrl
        - - http://localhost:3000/login/
          - !Ref WebLogoutUrl
        - - http://localhost:3000/login/
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 8
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: hours

  # ===========================================================================
  # (5) HttpApi - JWT authorizer (Cognito issuer) as the DEFAULT authorizer, so
  #     every route is deny-by-default: no valid token, no entry. Handlers read
  #     claims (incl. cognito:groups) from requestContext.authorizer.jwt.claims
  #     and derive org_unit via compass_common. The CompassContextAuthorizer
  #     (the authorizer Lambda) is also registered as a named REQUEST authorizer
  #     that validates the same Cognito JWT itself and injects
  #     {role, org_unit, groups} into the request context for any route that
  #     opts in per-event - and it serves GET /me.
  # ===========================================================================

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/http-api/${AWS::StackName}"
      RetentionInDays: 14

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1028]
    Properties:
      StageName: prod
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","path":"$context.path","status":"$context.status","responseLatency":"$context.responseLatency","authorizerError":"$context.authorizer.error"}'
      CorsConfiguration:
        # Keep AllowOrigins a literal list through the SAM transform. Wrapping
        # the entire list in Fn::If collapses the generated OpenAPI CORS object
        # to an origin array, so API Gateway receives no CORS configuration.
        AllowOrigins:
          - http://localhost:3000
          - http://127.0.0.1:3000
          - !If [HasWebOrigin, !Ref WebOrigin, !Ref "AWS::NoValue"]
          - !If
            - HasWebCustomDomain
            - !Sub "https://${WebCustomDomainName}"
            - !Ref "AWS::NoValue"
        AllowHeaders: [Content-Type, Authorization]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              # Web app sends ID tokens (aud = client id); access tokens carry
              # client_id instead of aud - API Gateway checks either.
              audience:
                - !Ref WebClient
          CompassContextAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            EnableFunctionDefaultPermissions: true
            Identity:
              Headers: [Authorization]

  # ===========================================================================
  # (6) Shared CommonLayer - compass_common (config, db w/ SET ROLE + RLS GUC,
  #     http, llm/Bedrock, audit) + psycopg2 from src/common/requirements.txt.
  # ===========================================================================

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-common"
      Description: compass_common helpers + psycopg2.
      ContentUri: src/common
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: makefile
      BuildArchitecture: arm64

  # ===========================================================================
  # (7) Data plane - raw landing bucket (EventBridge notifications on) and the
  #     on-demand Kinesis ticker stream, both under the customer KMS key.
  # ===========================================================================

  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-raw-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt AppKey.Arn
            BucketKeyEnabled: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [POST, PUT]
            AllowedOrigins:
              - http://localhost:3000
              - http://127.0.0.1:3000
              - !If [HasWebOrigin, !Ref WebOrigin, !Ref "AWS::NoValue"]
              - !If
                - HasWebCustomDomain
                - !Sub "https://${WebCustomDomainName}"
                - !Ref "AWS::NoValue"
            ExposedHeaders: [ETag]
            MaxAge: 900
      LifecycleConfiguration:
        Rules:
          - Id: expire-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: expire-document-inputs
            Status: Enabled
            Prefix: documents/incoming/
            ExpirationInDays: !Ref DocumentDataRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: expire-document-bronze
            Status: Enabled
            Prefix: documents/bronze/
            ExpirationInDays: !Ref DocumentDataRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: expire-document-silver
            Status: Enabled
            Prefix: documents/silver/
            ExpirationInDays: !Ref DocumentDataRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: expire-document-gold
            Status: Enabled
            Prefix: documents/gold/
            ExpirationInDays: !Ref DocumentDataRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: expire-document-quarantine
            Status: Enabled
            Prefix: documents/quarantine/
            ExpirationInDays: !Ref DocumentDataRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: expire-public-model-execution-data
            Status: Enabled
            Prefix: mlops/public-sbir-transition/executions/data/
            ExpirationInDays: !Ref ModelExecutionDataRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: expire-public-acquisition-payloads
            Status: Enabled
            Prefix: public-intelligence/acquisitions/
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  TickerStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub "${AWS::StackName}-ticker"
      StreamModeDetails:
        StreamMode: ON_DEMAND
      RetentionPeriodHours: 24
      StreamEncryption:
        EncryptionType: KMS
        KeyId: !Ref AppKey

  DocumentMlTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-document-ml"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: by-type
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt AppKey.Arn
      Tags:
        - { Key: compass:data-classification, Value: synthetic-demo }
        - { Key: compass:component, Value: document-ml }

  OperationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-operations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: by-type
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt AppKey.Arn
      Tags:
        - { Key: compass:data-classification, Value: operational-metadata }
        - { Key: compass:component, Value: operational-evidence }

  OperationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-operations"
      DisplayName: Compass operations
      KmsMasterKeyId: !Ref AppKey
      Tags:
        - { Key: compass:data-classification, Value: operational-metadata }
        - { Key: compass:component, Value: notifications }

  OperationsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref OperationsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: sns:*
            Resource: !Ref OperationsTopic
          - Sid: CloudWatchAlarmPublish
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref OperationsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  OperationsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref OperationsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  DocumentModelPackageGroup:
    Type: AWS::SageMaker::ModelPackageGroup
    Properties:
      ModelPackageGroupName: !Sub "${AWS::StackName}-document-classifier"
      ModelPackageGroupDescription: Governed model versions for Compass document classification.
      Tags:
        - { Key: compass:component, Value: document-ml }
        - { Key: compass:synthetic-only, Value: "true" }

  PublicFundingModelPackageGroup:
    Type: AWS::SageMaker::ModelPackageGroup
    Condition: CreatePublicFundingModelPackageGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ModelPackageGroupName: !Sub "${AWS::StackName}-public-funding-forecast"
      ModelPackageGroupDescription: Governed candidates trained from PII-minimized public funding evidence.
      Tags:
        - { Key: compass:component, Value: public-intelligence }
        - { Key: compass:data-classification, Value: public }

  PublicSbirTransitionModelPackageGroup:
    Type: AWS::SageMaker::ModelPackageGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ModelPackageGroupName: !Sub "${AWS::StackName}-public-sbir-transition"
      ModelPackageGroupDescription: Governed candidates trained from PII-minimized public Navy SBIR evidence.
      Tags:
        - { Key: compass:component, Value: public-intelligence }
        - { Key: compass:data-classification, Value: public }
        - { Key: compass:model-kind, Value: sbir-transition }

  DocumentSageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-document-sagemaker"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: sagemaker.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: document-training-artifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TrainingArtifactList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt RawBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: [mlops/*]
              - Sid: TrainingArtifactBucketLocation
                Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !GetAtt RawBucket.Arn
              - Sid: TrainingArtifactObjects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub "${RawBucket.Arn}/mlops/*"
              - Sid: TrainingArtifactKms
                Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt AppKey.Arn
              - Sid: TrainingTelemetry
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: "*"
      Tags:
        - { Key: compass:component, Value: document-ml }

  # -------------------------------------------------------------------------
  # Optional Scale Run data plane. Every resource in this section is guarded
  # so a deployment with ScaleFeatureEnabled=false keeps the existing stack
  # and its cost posture unchanged.
  # -------------------------------------------------------------------------

  ScaleDataLakeBucket:
    Type: AWS::S3::Bucket
    Condition: EnableScaleFeature
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt AppKey.Arn
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-landing-data
            Status: Enabled
            Prefix: landing/
            ExpirationInDays: !Ref ScaleDataRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: expire-curated-data
            Status: Enabled
            Prefix: curated/
            ExpirationInDays: !Ref ScaleDataRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: expire-quarantine-data
            Status: Enabled
            Prefix: quarantine/
            ExpirationInDays: !Ref ScaleDataRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: expire-parquet-data
            Status: Enabled
            Prefix: parquet/
            ExpirationInDays: !Ref ScaleDataRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: expire-partition-receipts
            Status: Enabled
            Prefix: receipts/
            ExpirationInDays: !Ref ScaleEvidenceRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: expire-run-evidence
            Status: Enabled
            Prefix: evidence/
            ExpirationInDays: !Ref ScaleEvidenceRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: expire-athena-results
            Status: Enabled
            Prefix: athena-results/
            ExpirationInDays: 2
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: expire-export-jobs
            Status: Enabled
            Prefix: exports/
            ExpirationInDays: 2
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: abort-incomplete-scale-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ScaleDataLakeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: EnableScaleFeature
    Properties:
      Bucket: !Ref ScaleDataLakeBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureScaleLakeTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ScaleDataLakeBucket.Arn
              - !Sub "${ScaleDataLakeBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ScaleRunsTable:
    Type: AWS::DynamoDB::Table
    Condition: EnableScaleFeature
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt AppKey.Arn
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at_epoch
        Enabled: true

  ScaleWorkerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Condition: EnableScaleFeature
    Properties:
      QueueName: !Sub "${AWS::StackName}-scale-worker-dlq"
      KmsMasterKeyId: !GetAtt AppKey.Arn
      KmsDataKeyReusePeriodSeconds: 300
      MessageRetentionPeriod: 1209600

  PublicSbirReconciliationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-sbir-reconciliation-dlq"
      KmsMasterKeyId: !GetAtt AppKey.Arn
      KmsDataKeyReusePeriodSeconds: 300
      MessageRetentionPeriod: 1209600

  ScaleWorkerQueue:
    Type: AWS::SQS::Queue
    Condition: EnableScaleFeature
    Properties:
      QueueName: !Sub "${AWS::StackName}-scale-worker"
      KmsMasterKeyId: !GetAtt AppKey.Arn
      KmsDataKeyReusePeriodSeconds: 300
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 960
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScaleWorkerDeadLetterQueue.Arn
        maxReceiveCount: 3

  ScaleExportDeadLetterQueue:
    Type: AWS::SQS::Queue
    Condition: EnableScaleFeature
    Properties:
      QueueName: !Sub "${AWS::StackName}-scale-export-dlq"
      KmsMasterKeyId: !GetAtt AppKey.Arn
      KmsDataKeyReusePeriodSeconds: 300
      MessageRetentionPeriod: 1209600

  ScaleExportQueue:
    Type: AWS::SQS::Queue
    Condition: EnableScaleFeature
    Properties:
      QueueName: !Sub "${AWS::StackName}-scale-export"
      KmsMasterKeyId: !GetAtt AppKey.Arn
      KmsDataKeyReusePeriodSeconds: 300
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 960
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScaleExportDeadLetterQueue.Arn
        maxReceiveCount: 3

  ScaleGlueDatabase:
    Type: AWS::Glue::Database
    Condition: EnableScaleFeature
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "${AWS::StackName}_scale"
        Description: Projected synthetic Scale Run data lake tables.

  ScaleGrantsTable:
    Type: AWS::Glue::Table
    Condition: EnableScaleFeature
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref ScaleGlueDatabase
      TableInput:
        Name: scale_grants
        Description: Curated synthetic grant records projected by Scale Run identifier.
        TableType: EXTERNAL_TABLE
        Parameters:
          EXTERNAL: "TRUE"
          classification: json
          compressionType: gzip
          projection.enabled: "true"
          projection.run_id.type: injected
          storage.location.template: !Sub "s3://${ScaleDataLakeBucket}/curated/grants/run_id=${!run_id}/"
        PartitionKeys:
          - { Name: run_id, Type: string }
        StorageDescriptor:
          Location: !Sub "s3://${ScaleDataLakeBucket}/curated/grants/"
          Compressed: true
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
          Columns:
            - { Name: schema_version, Type: string }
            - { Name: synthetic, Type: boolean }
            - { Name: synthetic_seed, Type: bigint }
            - { Name: source_system, Type: string }
            - { Name: grant_id, Type: string }
            - { Name: grant_no, Type: string }
            - { Name: title, Type: string }
            - { Name: program_area, Type: string }
            - { Name: org_unit, Type: string }
            - { Name: performer, Type: string }
            - { Name: fiscal_year, Type: int }
            - { Name: start_date, Type: string }
            - { Name: end_date, Type: string }
            - { Name: award_amount_usd, Type: bigint }
            - { Name: status, Type: string }
            - { Name: classification, Type: string }
            - { Name: scale_run_id, Type: string }
            - { Name: scale_dataset, Type: string }
            - { Name: scale_partition_id, Type: string }
            - { Name: scale_record_index, Type: bigint }

