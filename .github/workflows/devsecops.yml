name: CloudFormation policy gates

# Compass-specific gates the golden pipeline cannot express yet: the org
# standard (SatsyilCorp/golden-pipelines, consumed by pipeline.yml) owns SAST,
# dependency, secret, SBOM, and Terraform/OpenTofu scanning. This file keeps
# only the CloudFormation side - template validation, policy-as-code, and the
# STIG-aligned evidence index for template.yaml. When golden-pipelines gains a
# CloudFormation mode, this file retires.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudformation-policy:
    name: SAM validation, policy-as-code, and STIG evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: SAM and CloudFormation validation
        run: sam validate --lint

      - name: Install CloudFormation Guard
        run: cargo install cfn-guard --version 3.1.2 --locked

      - name: Strict policy-as-code validation
        run: cfn-guard validate --data template.yaml --rules security/policies/compass.guard --show-summary all

      - name: Validate STIG-aligned evidence index
        run: python scripts/validate_stig_controls.py --output artifacts/security/stig-evidence.json

      - name: Publish policy evidence
        uses: actions/upload-artifact@v4
        with:
          name: policy-and-stig-evidence
          path: artifacts/security/stig-evidence.json
          retention-days: 30
