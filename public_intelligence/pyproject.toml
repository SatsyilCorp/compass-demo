[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compass-public-intelligence"
version = "0.1.0"
description = "Bounded, resumable collectors for authoritative public research and award data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Satsyil" }]
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=17,<22"]

[project.scripts]
compass-public-intel = "public_intelligence.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
